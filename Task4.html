<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Name Colour</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        span {
            font-size: 60px;
            margin: 5px;
        }
    </style>
</head>

<body>


    <p id="bed1" style="display: none">
        A bed made by handimax
    </p>

    <img
       class="button"
       src="bed1.png"
       onclick="showOne()"
       />

    <p id="bed2" style="display: none">
        Another bed made by handimax
    </p>


    <img
       class="button"
       src="bed2.png"
       onclick="showTwo()"
       />

    
    <script>
       function showOne() {
        document.getElementById("bed2").style.display = "block"
        document.getElementById("bed1").style.display = "none"

       }    

       function showTwo() {
        document.getElementById("bed2").style.display = "none"
        document.getElementById("bed1").style.display = "block"

       }    

    </script>

</body>
</html>
